name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            rust_target: ""
            target_flag: ""
            run_tests: true
          - name: windows-arm64
            os: windows-latest
            rust_target: aarch64-pc-windows-msvc
            target_flag: "--target aarch64-pc-windows-msvc"
            # No native arm64 Windows runner exists, so this is a
            # cross-compile build/bench-compile check only, not a test run.
            run_tests: false
          - name: linux-x86_64
            os: ubuntu-latest
            rust_target: ""
            target_flag: ""
            run_tests: true
          - name: linux-arm64
            os: ubuntu-24.04-arm
            rust_target: ""
            target_flag: ""
            run_tests: true
          - name: macos
            os: macos-latest
            rust_target: ""
            target_flag: ""
            run_tests: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - if: matrix.run_tests
        run: cargo test --release --locked ${{ matrix.target_flag }}
      - run: cargo build --release --locked ${{ matrix.target_flag }}
      - run: cargo bench --no-default-features --bench vm --no-run --locked ${{ matrix.target_flag }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --release --locked --target wasm32-unknown-unknown --bin fanticon-app
      - id: cache-wasm-pack
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-${{ runner.arch }}-wasm-pack-0.13.1
      - if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.13.1 --locked
      - run: wasm-pack test --headless --chrome --test web_runtime --no-default-features --features app-host

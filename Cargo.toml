[package]
name = "fanticon"
version = "0.1.0"
edition = "2024"
description = "High-performance, cycle-accurate NMOS 6502 core for the Fanticon fantasy console"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "fanticon-app"
path = "src/main.rs"
required-features = ["app-host"]
bench = false

[features]
default = ["app-host"]
app-host = [
    "dep:bytemuck",
    "dep:cpal",
    "dep:gilrs",
    "dep:pollster",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:web-time",
    "dep:wgpu",
    "dep:winit",
]

[dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
bytemuck = { version = "1.24", features = ["derive"], optional = true }
cpal = { version = "0.16", optional = true }
gilrs = { version = "0.11.2", optional = true }
pollster = { version = "0.4", optional = true }
web-time = { version = "1.1", optional = true }
wgpu = { version = "30.0", optional = true }
winit = { version = "0.30", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Storage", "Window"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6.0"
fs2 = "0.4"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen-test = "0.3"

[build-dependencies]
dirs = "6.0"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[[test]]
name = "singlestep"
path = "tests/singlestep.rs"

[[bench]]
name = "vm"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

# Used for packaged builds only (see .github/workflows/release.yml). `panic =
# "abort"` is incompatible with `cargo test`/`cargo bench --no-run`, which
# both need unwinding to catch panics, so it can't live in [profile.release]
# itself without breaking `cargo test --release` in CI.
[profile.dist]
inherits = "release"
panic = "abort"
